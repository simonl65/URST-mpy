[project]
name = "urst-mpy"
version = "3.2.1"
description = "MicroPython implementation of the Universal Reliable Serial Transport protocol [URST](https://github.com/simonl65/URST-Specification/blob/main/URST-Specification.md)"
readme = "README.md"
license = "SUL-1.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Simon R. Lincoln", email = "oss@codeability.co.uk" }]
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: System :: Networking",
    "Topic :: Communications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

[project.urls]
"Repository" = "https://github.com/simonl65/URST-mpy"
"Bug Tracker" = "https://github.com/simonl65/URST-mpy/issues"

[build-system]
requires = ["uv_build>=0.11.19"]
build-backend = "uv_build"

[tool.uv_build]
package-dir = ""
[tool.uv.build-backend]
module-root = ""
module-name = "urst"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "uv-build>=0.11.19",
    "micropython-rp2-rpi_pico_w-stubs==1.28.0.*",
]


# --- Ruff ---
[tool.ruff]
src = ["urst"]
line-length = 80
target-version = "py312"
exclude = ["build", "dist", ".venv", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes errors
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear bug-hunting (e.g., bare except)
    "SIM", # flake8-simplify
    "S",   # security
    "I",   # isort imports
]
ignore = ["E501", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# --- Pytest ---
[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]

[tool.pyright]
include = ["."]
extraPaths = ["urst"]
ignore = ["**/typings"]
exclude = [
    ".*",
    "__*",
    "**/typings",
    "**/node_modules",
    "**/__pycache__",
    ".venv",
]

typeCheckingMode = "standard"
pythonPlatform = "Linux"
# Pin this repo's own venv explicitly rather than relying on VIRTUAL_ENV
# being set -- without this, pyright silently falls back to whatever
# "python3" is on PATH when run outside an activated venv.
venvPath = "."
venv = ".venv"
# stubPath overlays typings/ on top of the bundled typeshed (pyright
# prefers a matching stub over the bundled module), giving the
# MicroPython-only urst/ code (time.ticks_ms, micropython.native, etc.)
# its real signatures without discarding the bundled stdlib -- tests/
# run on the host under CPython and need real dataclasses, pathlib, etc.
# Not typeshedPath = "typings" too: that replaces the typeshed wholesale
# rather than overlaying it, and silently breaks unrelated stdlib.
stubPath = "typings"

reportMissingModuleSource = "none"

[project.optional-dependencies]
# install to folder typings
# uv pip install -r pyproject.toml --extra stubs --target typings
stubs = [
  "micropython-rp2-rpi_pico_w-stubs==1.28.0.*"
]
